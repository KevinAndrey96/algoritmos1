name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21", "25" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile with -Werror, test and package
        run: mvn -B verify

      - name: Judge samples through the JAR
        run: |
          samples=src/test/resources/samples
          for sample in burger-time common-subsequence-1 common-subsequence-2 informants integer-prefix-1 integer-prefix-2; do
            problem=${sample%-[0-9]}
            java -jar target/competitive.jar "$problem" < "$samples/$sample.in" | diff - "$samples/$sample.out"
          done
          if java -jar target/competitive.jar unknown < /dev/null; then exit 1; fi
